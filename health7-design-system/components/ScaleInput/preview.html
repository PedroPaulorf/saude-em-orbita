<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@700;900&family=Overpass:wght@400;600;700&family=Fira+Code:wght@400;700&display=swap">
<style>html,body{margin:0}</style></head><body>
<div class="h7" style="padding:var(--space-6)">
<div class="h7-field" style="max-width:420px">
  <span class="h7-label" id="q">How stressed do you feel right now?</span>
  <div class="h7-scale" role="radiogroup" aria-labelledby="q">
    <button class="h7-scale__opt" role="radio" aria-checked="false">1</button><button class="h7-scale__opt" role="radio" aria-checked="false">2</button><button class="h7-scale__opt" role="radio" aria-checked="true">3</button><button class="h7-scale__opt" role="radio" aria-checked="false">4</button><button class="h7-scale__opt" role="radio" aria-checked="false">5</button>
  </div>
  <div class="h7-scale__ends h7-sm"><span>Not at all</span><span>Extremely</span></div>
</div>
</div>
</body></html>
