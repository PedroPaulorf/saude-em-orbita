services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: health7
      POSTGRES_USER: health7
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - health7_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U health7 -d health7"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  health7_postgres:
