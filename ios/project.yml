name: Health7Companion
options:
  bundleIdPrefix: org.health7.prototype
  deploymentTarget:
    iOS: '17.0'
targets:
  Health7Companion:
    type: application
    platform: iOS
    sources: [Health7Companion]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.health7.prototype.companion
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1'
        CODE_SIGN_STYLE: Automatic
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Health7 Companion
        UILaunchScreen: {}
        NSHealthShareUsageDescription: Read authorized health measurements and send them to your signed-in Health7 account when you enable sync.
        NSLocalNetworkUsageDescription: Connect to your Health7 notebook on the same Wi-Fi to send the measurements you authorize.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Config/Health7Companion.entitlements
      properties:
        com.apple.developer.healthkit: true
